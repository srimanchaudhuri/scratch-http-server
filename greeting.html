<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello {{NAME}}</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #e4e6ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      text-align: center;
      padding: 52px 64px;
      border-radius: 16px;
      background: #161922;
      border: 1px solid #232630;
      animation: fadeUp 0.5s ease-out both;
      max-width: 480px;
    }

    .card__wave {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .card__greeting {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8b8fa3;
      margin-bottom: 8px;
    }

    .card__name {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .card__path {
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: #555a6e;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      display: inline-block;
      margin-bottom: 28px;
    }

    .card__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 8px;
      background: rgba(108, 99, 255, 0.12);
      border: 1px solid rgba(108, 99, 255, 0.2);
      color: #6c63ff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card__back:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.25);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .card {
        margin: 20px;
        padding: 40px 32px;
      }

      .card__name {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="card__wave">&#128075;</div>
    <p class="card__greeting">Hello there</p>
    <h1 class="card__name">{{NAME}}</h1>
    <p class="card__path">localhost:8080/{{NAME}}</p>
    <a href="/" class="card__back">&larr; Back home</a>
  </div>
</body>

</html>
